<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anthropic Vertex AI — Cloud Monitoring Dashboard Studio & Version Explorer</title>
  <style>
    :root {
      --bg-base: #0b0e14;
      --bg-panel: #131822;
      --bg-card: #181e2b;
      --bg-card-hover: #1e2638;
      --border: #2a3447;
      --text-main: #f0f4f8;
      --text-muted: #9aa0a6;
      --accent-blue: #8ab4f8;
      --accent-green: #81c995;
      --accent-yellow: #fdd663;
      --accent-red: #f28b82;
      --accent-purple: #c58af9;
      --accent-cyan: #78d9ec;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
    }
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
    }
    .badge {
      font-family: monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(120, 217, 236, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
    }
    .controls-bar {
      background: #10141d;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    select, button {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    select:hover, button:hover {
      border-color: var(--accent-blue);
    }
    button.active {
      background: rgba(138, 180, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      font-weight: 600;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 24px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      overflow-x: auto;
    }
    .nav-tab {
      padding: 10px 16px;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      font-weight: 600;
    }
    .main-container {
      max-width: 1700px;
      margin: 0 auto;
      padding: 20px 24px;
    }
    .banner-card {
      background: linear-gradient(135deg, #1a1d36 0%, #152238 100%);
      border: 1px solid var(--accent-blue);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .grid-48 {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }
    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .card-stripe {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .score-val {
      font-size: 28px;
      font-weight: 700;
      margin: 6px 0;
    }
    .score-sub {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
    }
    .section-title {
      grid-column: span 12;
      margin-top: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .table-widget {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 8px;
    }
    .table-widget th, .table-widget td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .table-widget th {
      color: var(--text-muted);
      background: rgba(0,0,0,0.2);
    }
    .bar-bg {
      width: 120px;
      height: 10px;
      background: #252f42;
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
    }
    .bar-fill {
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Google Cloud Monitoring › Vertex AI Anthropic Dashboards</span>
      <span class="badge" id="versionBadge">TAG: v3.3-final</span>
    </div>
    <div style="display:flex; gap:10px;">
      <button onclick="toggleDiffMode()" id="diffBtn">⇄ Compare Old (v2.0) vs New (v3.3)</button>
    </div>
  </header>

  <div class="controls-bar">
    <div class="control-group">
      <label>Version Lineage:</label>
      <select id="versionSelect" onchange="renderDashboard()">
        <option value="v3.3-final" selected>v3.3-final (Iter 3: Leaderboards + FinOps Playbooks)</option>
        <option value="v3.2-iter2">v3.2-iter2 (Iter 2: Donuts + Dual-Axis Overlays + Heatmaps)</option>
        <option value="v3.1-iter1">v3.1-iter1 (Iter 1: Multi-Filters + Ratio Scorecards)</option>
        <option value="v2.0-old">v2.0-old (Preserved Old Baseline - Commit 5ddb648)</option>
        <option value="v1.0-original">v1.0-original (Initial Commit d3840a7 / 21d0a75)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Filter model_id:</label>
      <select id="modelFilter" onchange="renderDashboard()">
        <option value="all">All Models (claude-fable-5, claude-opus-4, claude-sonnet-4)</option>
        <option value="claude-fable-5">claude-fable-5</option>
        <option value="claude-opus-4">claude-opus-4</option>
        <option value="claude-sonnet-4">claude-sonnet-4</option>
      </select>
    </div>
    <div class="control-group">
      <label>Filter location:</label>
      <select id="regionFilter" onchange="renderDashboard()">
        <option value="all">All Regions (global, us-central1, europe-west1)</option>
        <option value="global">global</option>
        <option value="us-central1">us-central1</option>
        <option value="europe-west1">europe-west1</option>
      </select>
    </div>
    <div class="control-group">
      <label>Simulate Incident Scenario:</label>
      <select id="scenarioSelect" onchange="renderDashboard()">
        <option value="normal">🟢 Normal Production Traffic</option>
        <option value="throttle">🔴 Regional 429 Quota Exhaustion (us-central1)</option>
        <option value="cache_break">🟡 Silent Cache Invalidation Regression</option>
        <option value="fable_tail">🟣 Fable 5 Deep Reasoning Tail Latency</option>
      </select>
    </div>
  </div>

  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" onclick="selectTab(0)">00 — Model Usage Summary</div>
    <div class="nav-tab" onclick="selectTab(1)">01 — Claude Fable 5 Deep-Dive</div>
    <div class="nav-tab" onclick="selectTab(2)">02 — Anthropic Fleet Overview</div>
    <div class="nav-tab" onclick="selectTab(3)">03 — Latency & Performance SLOs</div>
    <div class="nav-tab" onclick="selectTab(4)">04 — Errors & Reliability Triage</div>
    <div class="nav-tab" onclick="selectTab(5)">05 — Prompt Caching & FinOps</div>
    <div class="nav-tab" onclick="selectTab(6)">06 — Capacity, Quota & Shape</div>
  </div>

  <div class="main-container" id="dashboardRoot"></div>

  <script>
    let activeTab = 0;
    let diffMode = false;

    function selectTab(idx) {
      activeTab = idx;
      document.querySelectorAll('.nav-tab').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
      renderDashboard();
    }

    function toggleDiffMode() {
      diffMode = !diffMode;
      document.getElementById('diffBtn').classList.toggle('active', diffMode);
      renderDashboard();
    }

    function renderDashboard() {
      const ver = document.getElementById('versionSelect').value;
      const scenario = document.getElementById('scenarioSelect').value;
      document.getElementById('versionBadge').textContent = `TAG: ${ver}`;
      const root = document.getElementById('dashboardRoot');

      if (diffMode) {
        root.innerHTML = `
          <div class="banner-card">
            <div>
              <h2>⇄ Recursive Self-Improvement Diff Comparison: Preserved Old (v2.0-old) vs New (v3.3-final)</h2>
              <p style="color:var(--text-muted); font-size:13px; margin-top:4px;">
                All tags and versions (v1.0-original, v2.0-old, v3.1-iter1, v3.2-iter2, v3.3-final) are preserved in git tags, filesystem directories, and Cloud Monitoring labels.
              </p>
            </div>
          </div>
          <div class="grid-48">
            <div class="card col-6" style="border-color: var(--accent-yellow);">
              <div class="card-title"><span>[v2.0-old] Preserved Baseline Version</span><span class="badge">TAG: v2-0-old</span></div>
              <ul style="font-size:13px; color:var(--text-muted); padding-left:18px; line-height:1.8;">
                <li><strong>Interactive Filters:</strong> Only 1 filter (<code>model_user_id</code>); 0 filters on Fable 5 dashboard.</li>
                <li><strong>Scorecards:</strong> Raw volume counts only; zero ratio queries (<code>timeSeriesFilterRatio</code>).</li>
                <li><strong>Visual Diversity:</strong> Only basic <code>STACKED_BAR</code> and <code>LINE</code> charts; zero Donut charts.</li>
                <li><strong>Latency Dashboard (03):</strong> Zero scorecards; siloed p50 and p95 charts; missing TTFT heatmap.</li>
                <li><strong>Tables & Playbooks:</strong> Zero <code>timeSeriesTable</code> leaderboards or FinOps break-even guides.</li>
              </ul>
            </div>
            <div class="card col-6" style="border-color: var(--accent-green);">
              <div class="card-title"><span>[v3.3-final] Recursively Improved Version</span><span class="badge">TAG: v3-3-final</span></div>
              <ul style="font-size:13px; color:var(--text-main); padding-left:18px; line-height:1.8;">
                <li><strong>Multi-Dimensional Filters:</strong> Filter dynamically by <code>model_id</code>, <code>location</code>, <code>model_version</code>, and <code>api_method</code>.</li>
                <li><strong>Normalized Ratio Scorecards:</strong> Native <code>timeSeriesFilterRatio</code> for Error Rate %, Cache Hit %, and Tokens/Req.</li>
                <li><strong>Donut Visualizations:</strong> Instant proportional rings for Model Share, Billing Tier Share, and Regional Split.</li>
                <li><strong>Dual-Axis & Unified Percentiles:</strong> Overlay Volume (Y1) vs Errors/Latency (Y2) and p50/p95/p99 curves with SLO lines.</li>
                <li><strong>Live Leaderboards & FinOps Playbooks:</strong> Sortable <code>timeSeriesTable</code> with visual bars + Break-Even formulas.</li>
              </ul>
            </div>
          </div>
        `;
        return;
      }

      const isErrorSpike = scenario === 'throttle';
      const isCacheBreak = scenario === 'cache_break';
      const errVal = isErrorSpike ? "842" : "42";
      const errRatio = isErrorSpike ? "5.89%" : "0.29%";
      const errCol = isErrorSpike ? "var(--accent-red)" : "var(--accent-green)";
      const hitRatio = isCacheBreak ? "18.4%" : "83.2%";
      const hitCol = isCacheBreak ? "var(--accent-red)" : "var(--accent-green)";

      root.innerHTML = `
        <div class="banner-card">
          <div>
            <h2>📊 Anthropic Model Monitoring Suite — Active View: Tab #${activeTab} (${ver})</h2>
            <p style="color:var(--text-muted); font-size:13px; margin-top:4px;">
              Interactive telemetry simulation active. Use the dropdowns above to test regional 429 quota spikes, cache invalidations, or version switching.
            </p>
          </div>
          <span class="badge">${ver}</span>
        </div>

        <div class="grid-48">
          <div class="section-title">
            <h3>🔑 24h Scorecards & Normalized Ratios (timeSeriesFilterRatio)</h3>
            <span style="font-size:12px; color:var(--text-muted);">Updated live with selected scenario & filters</span>
          </div>

          <div class="card col-2">
            <div class="card-stripe" style="background:var(--accent-blue);"></div>
            <div class="card-title">Total Tokens (24h)</div>
            <div class="score-val">64.8M</div>
            <div class="score-sub" style="color:var(--accent-blue);">▲ +14.2% vs 7d avg</div>
          </div>
          <div class="card col-2">
            <div class="card-stripe" style="background:var(--accent-cyan);"></div>
            <div class="card-title">Requests (24h)</div>
            <div class="score-val">14,280</div>
            <div class="score-sub" style="color:var(--accent-cyan);">91.4% streaming</div>
          </div>
          <div class="card col-2">
            <div class="card-stripe" style="background:var(--accent-purple);"></div>
            <div class="card-title">Avg Tokens / Req</div>
            <div class="score-val">4,538</div>
            <div class="score-sub" style="color:var(--accent-purple);">Tok / Invoc Ratio</div>
          </div>
          <div class="card col-2">
            <div class="card-stripe" style="background:${hitCol};"></div>
            <div class="card-title">Cache Hit Ratio</div>
            <div class="score-val" style="color:${hitCol};">${hitRatio}</div>
            <div class="score-sub" style="color:${hitCol};">${isCacheBreak ? '⚠️ Cache Regression!' : 'Target > 50% Healthy'}</div>
          </div>
          <div class="card col-2">
            <div class="card-stripe" style="background:${errCol};"></div>
            <div class="card-title">Non-200 Errors</div>
            <div class="score-val" style="color:${errCol};">${errVal}</div>
            <div class="score-sub" style="color:${errCol};">${isErrorSpike ? '🚨 429 Quota Spike!' : 'Within SLO budget'}</div>
          </div>
          <div class="card col-2">
            <div class="card-stripe" style="background:${errCol};"></div>
            <div class="card-title">Error Rate Ratio</div>
            <div class="score-val" style="color:${errCol};">${errRatio}</div>
            <div class="score-sub" style="color:${errCol};">SLO Ceiling &lt; 1.0%</div>
          </div>

          <div class="section-title">
            <h3>📋 Live Tabular Leaderboard (timeSeriesTable with metricVisualization: BAR)</h3>
            <span style="font-size:12px; color:var(--accent-cyan);">Sortable multi-dimensional matrix</span>
          </div>

          <div class="card col-8">
            <div class="card-title"><span>Per-Model & Serving Location Leaderboard</span><span>24h Window</span></div>
            <table class="table-widget">
              <thead>
                <tr><th>Model User ID</th><th>GCP Location</th><th>Billing Token Type</th><th>24h Volume & Bar</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td><code>claude-fable-5</code></td>
                  <td><code>global</code></td>
                  <td><code>cache_read_input (0.1x)</code></td>
                  <td>26.4M tok <div class="bar-bg"><div class="bar-fill" style="width:92%; background:var(--accent-green);"></div></div></td>
                </tr>
                <tr>
                  <td><code>claude-fable-5</code></td>
                  <td><code>global</code></td>
                  <td><code>output (generated)</code></td>
                  <td>6.8M tok <div class="bar-bg"><div class="bar-fill" style="width:58%; background:var(--accent-purple);"></div></div></td>
                </tr>
                <tr>
                  <td><code>claude-opus-4</code></td>
                  <td><code>us-central1</code></td>
                  <td><code>cache_read_input (0.1x)</code></td>
                  <td>12.1M tok <div class="bar-bg"><div class="bar-fill" style="width:74%; background:var(--accent-blue);"></div></div></td>
                </tr>
                <tr>
                  <td><code>claude-sonnet-4</code></td>
                  <td><code>europe-west1</code></td>
                  <td><code>input (uncached 1.0x)</code></td>
                  <td>3.2M tok <div class="bar-bg"><div class="bar-fill" style="width:38%; background:var(--accent-red);"></div></div></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="card col-4" style="background: #141f36; border-color: var(--accent-blue);">
            <div class="card-title" style="color:var(--accent-blue);">🧭 FinOps & SRE Triage Guide</div>
            <p style="font-size:12px; color:var(--text-main); margin-bottom:8px;">
              <strong>▪ FinOps Cache Break-Even:</strong> 5-min TTL cache writes cost <code>1.25x</code> input price and break even at <strong>1.28 reads/write</strong>. Current read/write ratio is <strong>25.4x</strong> (net 84.7% discount).
            </p>
            <p style="font-size:12px; color:var(--text-main);">
              <strong>▪ SRE Regional Failover:</strong> When <code>429</code> throttling spikes in a single region (e.g. <code>us-central1</code>), route overflow traffic to the <code>global</code> endpoint.
            </p>
          </div>
        </div>
      `;
    }

    renderDashboard();
  </script>
</body>
</html>
